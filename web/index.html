<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#08080f; --surface:#11111b; --raised:#181826; --line:#24243a; --text:#f1f0ff; --muted:#9a98b8; --faint:#62607e;
    --nova:#8b7bff; --nova2:#5ad1ff; --listen:#ff5f8a; --think:#ffb85c; --speak:#5ad1ff;
    --ok:#4fd1a1; --warn:#ffb85c; --danger:#ff5f6d; --state:var(--nova);
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; color:var(--text); background:var(--bg);
         font:15px/1.5 "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased; }
  body::before { content:""; position:fixed; inset:0 0 auto 0; height:420px; pointer-events:none; z-index:-1;
                 background:radial-gradient(60% 100% at 70% 0%, color-mix(in srgb, var(--state) 16%, transparent), transparent 70%);
                 transition:background 0.6s; }
  .wrap { max-width:1320px; margin:0 auto; padding:22px 24px 40px; }
  .num { font-variant-numeric:tabular-nums; }

  header { display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px; }
  .brand { display:flex; align-items:center; gap:12px; }
  .mark { width:30px; height:30px; border-radius:50%; background:radial-gradient(circle at 35% 30%, #fff 0 8%, var(--nova2) 30%, var(--nova) 70%);
          box-shadow:0 0 18px color-mix(in srgb, var(--nova) 60%, transparent); }
  .brand h1 { margin:0; font-size:22px; font-weight:800; letter-spacing:-.4px; }
  .brand span { color:var(--muted); font-size:13px; margin-left:4px; font-weight:500; }
  .status { display:flex; gap:8px; }
  .chip { display:flex; align-items:center; gap:8px; padding:7px 12px; border-radius:999px; border:1px solid var(--line);
          background:var(--surface); font-size:13px; color:var(--muted); font-weight:500; }
  .chip .d { width:7px; height:7px; border-radius:50%; background:var(--faint); }
  .chip.on .d { background:var(--ok); box-shadow:0 0 8px var(--ok); }

  .grid { display:grid; gap:18px; grid-template-columns:minmax(0,1.6fr) minmax(340px,1fr); align-items:start; }
  .col { display:flex; flex-direction:column; gap:18px; min-width:0; }
  @media (max-width:940px) { .grid { grid-template-columns:1fr; } .col.side { order:-1; } }
  .panel { background:var(--surface); border:1px solid var(--line); border-radius:20px; }
  .head { display:flex; justify-content:space-between; align-items:center; padding:14px 18px 0; font-size:12px;
          font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--muted); }
  .head small { text-transform:none; letter-spacing:0; font-weight:500; color:var(--faint); font-size:12px; }

  /* ---------- Nova ---------- */
  .nova { padding:26px 22px 18px; display:flex; flex-direction:column; align-items:center; text-align:center; overflow:hidden; position:relative; }
  .orb { width:132px; height:132px; border:none; padding:0; border-radius:50%; cursor:pointer; position:relative;
         background:radial-gradient(circle at 35% 30%, #fff 0 4%, color-mix(in srgb, var(--state) 40%, #fff) 14%, var(--state) 48%, color-mix(in srgb, var(--state) 40%, #000) 100%);
         box-shadow:0 0 60px color-mix(in srgb, var(--state) 55%, transparent), inset 0 -10px 30px rgba(0,0,0,.35);
         animation:breathe 4s ease-in-out infinite; transition:background .5s, box-shadow .5s; }
  .orb:focus-visible { outline:3px solid var(--text); outline-offset:6px; }
  .orb::before, .orb::after { content:""; position:absolute; inset:-1px; border-radius:50%; border:2px solid var(--state); opacity:0; }
  .listening .orb::before { animation:ripple 1.6s ease-out infinite; }
  .listening .orb::after { animation:ripple 1.6s .8s ease-out infinite; }
  .thinking .orb { background:conic-gradient(from 0deg, var(--think), var(--nova), var(--nova2), var(--think)); animation:spin 1.4s linear infinite; }
  .bars { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:5px; opacity:0; transition:opacity .3s; }
  .bars i { width:5px; height:18px; border-radius:3px; background:rgba(255,255,255,.92); animation:wave 0.9s ease-in-out infinite; }
  .bars i:nth-child(2) { animation-delay:.12s } .bars i:nth-child(3) { animation-delay:.24s } .bars i:nth-child(4) { animation-delay:.36s } .bars i:nth-child(5) { animation-delay:.48s }
  .speaking .bars { opacity:1; }
  .mic-ico { position:absolute; inset:0; display:grid; place-items:center; color:rgba(255,255,255,.95); transition:opacity .3s; }
  .speaking .mic-ico, .thinking .mic-ico { opacity:0; }
  .state { margin-top:18px; font-size:13px; font-weight:700; letter-spacing:1.4px; text-transform:uppercase; color:var(--state); }
  .says { margin-top:8px; font-size:21px; font-weight:600; line-height:1.35; letter-spacing:-.2px; max-width:440px; min-height:58px; }
  .says .you { display:block; font-size:13px; font-weight:500; color:var(--muted); margin-bottom:6px; letter-spacing:0; }
  .composer { display:flex; gap:8px; width:100%; margin-top:18px; }
  .composer input { flex:1; min-width:0; height:46px; padding:0 16px; border-radius:14px; border:1px solid var(--line);
                    background:var(--bg); color:var(--text); font:inherit; outline:none; transition:border-color .2s; }
  .composer input:focus { border-color:var(--nova); }
  .composer button { height:46px; padding:0 18px; border-radius:14px; border:none; font:inherit; font-weight:700; cursor:pointer;
                     background:var(--text); color:var(--bg); }
  .tries { display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:12px; }
  .tries button { padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--raised);
                  color:var(--muted); font:inherit; font-size:13px; cursor:pointer; transition:.2s; }
  .tries button:hover { color:var(--text); border-color:var(--nova); }

  /* ---------- Live view ---------- */
  .live { overflow:hidden; }
  .frame { position:relative; aspect-ratio:16/9; background:#000; margin:12px; border-radius:14px; overflow:hidden; }
  .frame img { width:100%; height:100%; object-fit:cover; display:block; }
  .frame .empty { position:absolute; inset:0; display:grid; place-items:center; color:var(--faint); }
  .frame.alerting { box-shadow:inset 0 0 0 3px var(--danger); }
  .tagl { position:absolute; top:12px; left:12px; display:flex; align-items:center; gap:6px; padding:5px 10px; border-radius:8px;
          background:rgba(8,8,15,.65); font-size:11px; font-weight:800; letter-spacing:1.4px; backdrop-filter:blur(6px); }
  .tagl i { width:6px; height:6px; border-radius:50%; background:var(--danger); animation:blink 1.4s infinite; }
  .flag { position:absolute; top:12px; right:12px; padding:6px 12px; border-radius:8px; background:var(--danger); color:#fff;
          font-size:13px; font-weight:700; text-transform:capitalize; }
  .seen { position:absolute; left:12px; bottom:12px; right:12px; display:flex; flex-wrap:wrap; gap:6px; }
  .seen span { padding:4px 10px; border-radius:8px; background:rgba(8,8,15,.65); backdrop-filter:blur(6px); font-size:12px;
               font-weight:600; text-transform:capitalize; }

  /* ---------- Path ---------- */
  .path .body { padding:12px 18px 18px; display:flex; align-items:center; gap:18px; }
  .gauge { width:84px; height:84px; flex:none; }
  .gauge circle { fill:none; stroke-width:8; }
  .gauge .track { stroke:var(--raised); }
  .gauge .fill { stroke:var(--pc, var(--nova)); stroke-linecap:round; transition:stroke-dashoffset .4s, stroke .4s; transform:rotate(-90deg); transform-origin:50% 50%; }
  .dist { font-size:34px; font-weight:800; letter-spacing:-1px; line-height:1.05; }
  .what { color:var(--muted); font-size:14px; }
  .what::first-letter { text-transform:uppercase; }
  .toggle { padding:4px 10px; border-radius:999px; border:1px solid var(--line); background:var(--raised); color:var(--ok);
            font:inherit; font-size:12px; font-weight:600; letter-spacing:0; text-transform:none; cursor:pointer; }
  .toggle[aria-pressed="false"] { color:var(--faint); }
  .lanes { display:grid; grid-template-columns:repeat(5,1fr); gap:4px; margin-top:10px; }
  .lane { height:5px; border-radius:3px; background:var(--raised); transition:background .25s; }
  .lane.hit { background:var(--pc, var(--nova)); }

  /* ---------- Belongings ---------- */
  .items { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px; padding:12px 18px 18px; }
  .item { border-radius:16px; overflow:hidden; background:var(--raised); border:1px solid transparent; transition:border-color .3s; }
  .item.fresh { border-color:color-mix(in srgb, var(--nova2) 60%, transparent); }
  .item img { width:100%; aspect-ratio:16/10; object-fit:cover; display:block; background:#000; }
  .item .b { padding:10px 12px 12px; }
  .item .name { display:flex; justify-content:space-between; align-items:center; gap:8px; font-weight:700; text-transform:capitalize; }
  .tag { font-size:11px; font-weight:600; padding:2px 8px; border-radius:99px; text-transform:none; color:var(--ok);
         background:color-mix(in srgb, var(--ok) 14%, transparent); }
  .tag.unsure { color:var(--warn); background:color-mix(in srgb, var(--warn) 14%, transparent); }
  .item .where { font-size:13px; color:var(--muted); margin-top:3px; }
  .item .when { font-size:12px; color:var(--faint); margin-top:4px; }

  /* ---------- History ---------- */
  .log { max-height:300px; overflow-y:auto; padding:6px 18px 14px; }
  .turn { padding:10px 0; border-bottom:1px solid var(--line); }
  .turn:last-child { border-bottom:none; }
  .turn .q { display:flex; justify-content:space-between; gap:10px; font-size:13px; color:var(--muted); }
  .turn .a { margin-top:3px; display:flex; gap:8px; }
  .turn .a::before { content:""; flex:none; width:10px; height:10px; margin-top:6px; border-radius:50%;
                     background:radial-gradient(circle at 35% 30%, #fff 0 10%, var(--nova2) 35%, var(--nova)); }
  .none { padding:16px 18px; color:var(--faint); font-size:14px; }

  @keyframes breathe { 50% { transform:scale(1.035); } }
  @keyframes ripple { 0% { opacity:.8; transform:scale(1); } 100% { opacity:0; transform:scale(1.7); } }
  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes wave { 0%,100% { height:12px; } 50% { height:40px; } }
  @keyframes blink { 50% { opacity:.3; } }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="mark" aria-hidden="true"></div><h1>Nova<span>your eyes, out loud</span></h1></div>
    <div class="status">
      <div class="chip" id="camstat"><span class="d"></span><span id="camtext">Camera connecting</span></div>
      <div class="chip" id="fpschip"><span class="num" id="fps">0 fps</span></div>
    </div>
  </header>

  <main class="grid">
    <div class="col">
      <section class="panel live" aria-label="Live view">
        <div class="head">What Nova sees</div>
        <div class="frame" id="frame">
          <img id="live" alt="Live view from the chest camera">
          <div class="empty" id="nocam">Waiting for camera…</div>
          <div class="tagl"><i></i>LIVE</div>
          <div class="flag" id="flag" hidden></div>
          <div class="seen" id="seen"></div>
        </div>
      </section>

      <section class="panel" aria-label="Belongings">
        <div class="head">Belongings <small>Where Nova last saw them</small></div>
        <div class="items" id="memory"></div>
      </section>
    </div>

    <div class="col side">
      <section class="panel nova" id="nova" aria-label="Nova">
        <button class="orb" id="talk" aria-label="Talk to Nova">
          <span class="mic-ico"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></span>
          <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        </button>
        <div class="state" id="state" aria-live="polite">Tap to talk</div>
        <div class="says" id="says" aria-live="polite">Hi, I'm Nova. Ask me where your things are, what's ahead, or to find a friend.</div>
        <form class="composer" id="ask"><input id="q" placeholder="Or type a question…" aria-label="Type a question" autocomplete="off"><button type="submit">Ask</button></form>
        <div class="tries"><button>Where are my keys?</button><button>What's in front of me?</button><button>Find my friend in blue</button></div>
      </section>

      <section class="panel path" id="path" aria-label="Path ahead">
        <div class="head">Path ahead <button class="toggle" id="warn" aria-pressed="true">Spoken warnings on</button></div>
        <div class="body">
          <svg class="gauge" viewBox="0 0 100 100" aria-hidden="true">
            <circle class="track" cx="50" cy="50" r="40"/><circle class="fill" id="gfill" cx="50" cy="50" r="40" stroke-dasharray="251.3" stroke-dashoffset="251.3"/>
          </svg>
          <div style="flex:1;min-width:0">
            <div class="dist num" id="dist" aria-live="polite">Clear</div>
            <div class="what" id="obwhat">Nothing in the way</div>
            <div class="lanes" id="lanes"></div>
          </div>
        </div>
      </section>

      <section class="panel" aria-label="Conversation history">
        <div class="head">History</div>
        <div class="log" id="log"></div>
      </section>
    </div>
  </main>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ago = (t, now) => { const m = Math.floor((now - t) / 60); return m < 1 ? "just now" : m < 60 ? m + " min ago" : Math.floor(m / 60) + " h ago"; };
const clock = t => new Date(t * 1000).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
const ZONES = ["on your left", "slightly to your left", "straight ahead", "slightly to your right", "on your right"];
const STATES = {idle:["Tap to talk", "--nova"], listening:["Listening…", "--listen"], thinking:["Thinking…", "--think"], speaking:["Speaking", "--speak"]};
$("lanes").innerHTML = ZONES.map(z => `<div class="lane" data-zone="${z}"></div>`).join("");

// Live image: load the next frame off-screen, then swap, so it never flickers
let camOk = false, frames = 0;
function nextFrame() {
  const img = new Image();
  img.onload = () => { $("live").src = img.src; camOk = true; frames++; $("nocam").hidden = true; setTimeout(nextFrame, 120); };
  img.onerror = () => { camOk = false; $("nocam").hidden = false; setTimeout(nextFrame, 1000); };
  img.src = "/live.jpg?" + Date.now();
}
nextFrame();
setInterval(() => { $("fps").textContent = frames + " fps"; frames = 0; }, 1000);

let lastLog = "", lastItems = "", lastSays = "";
async function refresh() {
  let s;
  try { s = await (await fetch("/api/state")).json(); }
  catch (e) { $("camstat").className = "chip"; $("camtext").textContent = "Nova offline"; return; }

  $("camstat").className = "chip" + (camOk ? " on" : "");
  $("camtext").textContent = camOk ? "Camera live" : "Camera connecting";

  // Nova's presence
  const [label, colour] = STATES[s.mic] || STATES.idle;
  $("nova").className = "panel nova " + s.mic;
  document.documentElement.style.setProperty("--state", `var(${colour})`);
  $("state").textContent = label;
  const last = s.log[s.log.length - 1];
  const says = last ? `<span class="you">“${esc(last.question || "Voice question")}”</span>${esc(last.answer)}` : null;
  if (says && says !== lastSays) $("says").innerHTML = lastSays = says;

  // Live view overlays
  const seen = [...new Set(s.detections.map(d => d.label))];
  $("seen").innerHTML = seen.map(l => `<span>${esc(l)}</span>`).join("");

  $("warn").setAttribute("aria-pressed", s.warnings_on);
  $("warn").textContent = s.warnings_on ? "Spoken warnings on" : "Spoken warnings muted";

  // Path ahead
  const ob = s.obstacle, d = s.distance_cm / 100, near = d > 0 && d < 1, mid = d >= 1 && d < 2.5;
  const pc = near ? "var(--danger)" : mid ? "var(--warn)" : "var(--nova)";
  $("path").style.setProperty("--pc", pc);
  $("dist").textContent = d > 0 ? d.toFixed(1) + " m" : "Clear";
  $("dist").style.color = near ? "var(--danger)" : mid ? "var(--warn)" : "";
  $("obwhat").textContent = ob ? `${ob[0]} · ${ob[2]}` : "Nothing in the way";
  $("gfill").style.strokeDashoffset = 251.3 * (1 - (d > 0 ? Math.max(.05, Math.min(1, 1 - d / 4)) : 0));
  document.querySelectorAll(".lane").forEach(l => l.classList.toggle("hit", !!ob && l.dataset.zone === ob[2]));
  $("frame").classList.toggle("alerting", !!ob && near);
  $("flag").hidden = !(ob && near);
  if (ob) $("flag").textContent = `${ob[0]} · ${d.toFixed(1)} m`;

  // History, newest first
  const log = s.log.slice().reverse().map(x => `<div class="turn">
      <div class="q"><span>${esc(x.question || "Voice question")}</span><span class="num">${clock(x.time)}</span></div>
      <div class="a">${esc(x.answer)}</div></div>`).join("") || '<div class="none">Nothing asked yet.</div>';
  if (log !== lastLog) { $("log").innerHTML = lastLog = log; $("log").scrollTop = 0; }

  // Belongings, most recently seen first
  const items = Object.entries(s.memory).sort((a, b) => b[1].time - a[1].time).map(([k, v]) => {
    const checked = v.described_at >= v.time - 90;
    const where = checked ? (v.verified === false ? "Not confirmed" : v.description) : v.near;
    const tag = checked ? (v.verified === false ? '<span class="tag unsure">Unconfirmed</span>' : '<span class="tag">Verified</span>') : "";
    return `<div class="item${s.now - v.time < 10 ? " fresh" : ""}">
      <img src="/memory/${encodeURIComponent(v.image)}?${v.time}" alt="${esc(k)}" loading="lazy">
      <div class="b"><div class="name">${esc(k)} ${tag}</div>
      <div class="where">${esc(where || "Location not described yet")}</div>
      <div class="when">Seen ${ago(v.time, s.now)}</div></div></div>`;
  }).join("") || '<div class="none">Nothing remembered yet. Show Nova your keys.</div>';
  if (items !== lastItems) $("memory").innerHTML = lastItems = items;
}

async function ask(q) {
  if (!q) return;
  $("q").value = "";
  await fetch("/api/ask", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({question:q})});
  refresh();
}
$("ask").onsubmit = e => { e.preventDefault(); ask($("q").value.trim()); };
document.querySelectorAll(".tries button").forEach(b => b.onclick = () => ask(b.textContent));
$("talk").onclick = () => fetch("/api/listen", {method:"POST"});
$("warn").onclick = () => fetch("/api/warnings", {method:"POST"}).then(refresh);
setInterval(refresh, 400); refresh();
</script>
</body>
</html>
